app = "serverminecrat"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "mc_data"
  destination = "/data"

[env]
  PORT = "25565"
  SERVER_DIR = "/data/server"
  OFFLINE_MODE = "false"
  PYTHONUNBUFFERED = "1"

[[services]]
  internal_port = 25565
  protocol = "tcp"
  
  [[services.ports]]
    port = 25565
    handlers = []

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2048mb"
